<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Inbox</title>
<link rel="icon" href="/static/icon.svg">
<script>
  try { const t = JSON.parse(localStorage.getItem("prefs"))?.theme; if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --border: #dfe3e8; --text: #1c2128; --muted: #636c76;
  --accent: #3b6fd8; --red: #cf222e; --red-bg: #ffebe9; --orange: #bc4c00; --orange-bg: #fff1e5;
  --green: #1a7f37; --green-bg: #dafbe1; --gray-bg: #eaeef2; --purple: #8250df; --purple-bg: #fbefff;
  --yellow: #9a6700; --yellow-bg: #fff8c5;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #161b22; --panel-2: #1c2129; --border: #2d333b; --text: #e6edf3; --muted: #8b949e;
    --accent: #6e9bf5; --red: #ff7b72; --red-bg: #3d1517; --orange: #ffa657; --orange-bg: #3a2311;
    --green: #56d364; --green-bg: #12301b; --gray-bg: #262c36; --purple: #c297ff; --purple-bg: #2c1f43;
    --yellow: #e3b341; --yellow-bg: #332a0f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #161b22; --panel-2: #1c2129; --border: #2d333b; --text: #e6edf3; --muted: #8b949e;
  --accent: #6e9bf5; --red: #ff7b72; --red-bg: #3d1517; --orange: #ffa657; --orange-bg: #3a2311;
  --green: #56d364; --green-bg: #12301b; --gray-bg: #262c36; --purple: #c297ff; --purple-bg: #2c1f43;
  --yellow: #e3b341; --yellow-bg: #332a0f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; cursor: pointer; }

header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--border);
  padding: 10px var(--gutter) 8px; display: flex; flex-direction: column; gap: 8px; }
.row1 { display: grid; grid-template-columns: 1fr minmax(220px, 380px) 1fr; align-items: center; gap: 12px; }
.row1 .hl, .row1 .hr { display: flex; align-items: center; gap: 12px; min-width: 0; }
.row1 .hr { justify-content: flex-end; gap: 8px; }
.row1 #q { width: 100%; }
.brand { font-weight: 650; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.brand img { width: 20px; height: 20px; }
.tabs { display: flex; gap: 2px; background: var(--panel-2); border-radius: 8px; padding: 2px; }
.tabs button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; color: var(--muted); }
.tabs button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px #0002; font-weight: 600; }
.tabs .n { font-size: 11px; opacity: .75; margin-left: 4px; }
.spacer { flex: 1; }
input[type=search] { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px;
  color: var(--text); width: 220px; font: inherit; }
.iconbtn { border: 1px solid var(--border); background: var(--panel); border-radius: 6px; padding: 4px 8px; color: var(--muted); display: inline-flex; }
/* Octicons: they take the text color; .ok/.bad/.wait/.mut give the GitHub status colors. */
.oi { width: 14px; height: 14px; fill: currentColor; flex: none; vertical-align: -2px; }
.oi.ok { color: var(--green); } .oi.bad { color: var(--red); } .oi.wait { color: var(--yellow); } .oi.mut { color: var(--muted); }
.oi.big { width: 18px; height: 18px; vertical-align: -4px; }
.iconbtn:hover { background: var(--panel-2); }
.conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); border: 1px solid var(--border);
  border-radius: 999px; padding: 3px 10px; background: var(--panel); cursor: pointer; white-space: nowrap;
  width: 200px; justify-content: flex-start; overflow: hidden; }
.conn .txt { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.conn .dot { flex: none; }
.conn:hover { background: var(--panel-2); }
.conn .dot { width: 8px; height: 8px; }
.conn.ok .dot { background: var(--green); } .conn.warn .dot { background: var(--yellow); } .conn.err .dot { background: var(--red); }
.conn.err { color: var(--red); border-color: var(--red); }
.conn.syncing .dot { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
/* Accounts: a colour per account (stripe on each PR + badge), only when more than one is active. */
.acct-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; border-radius: 4px;
  padding: 1px 6px; color: #fff; background: var(--acc); white-space: nowrap; flex: none; }
.multi .pr { box-shadow: inset 3px 0 0 var(--acc); }
.multi details.repo > summary { box-shadow: inset 3px 0 0 var(--acc); }

/* Settings drawer */
#backdrop { position: fixed; inset: 0; background: #0005; z-index: 30; }
#settings { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); background: var(--bg); z-index: 31;
  border-left: 1px solid var(--border); box-shadow: -8px 0 30px #0003; display: flex; flex-direction: column; }
.hidden { display: none !important; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
  border-bottom: 1px solid var(--border); background: var(--panel); font-size: 15px; }
#settings-body { overflow: auto; padding: 14px 16px 30px; display: flex; flex-direction: column; gap: 14px; }
.sect h3 { margin: 4px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex;
  flex-direction: column; gap: 8px; }
.acct-card { border-left: 4px solid var(--acc); }
.acct-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.acct-row input[type=text], .card input[type=text], .card input[type=password] { background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 8px; color: var(--text); font: inherit; }
.acct-row input[type=color] { width: 28px; height: 24px; border: 1px solid var(--border); border-radius: 6px; padding: 0; background: none; }
.acct-row .who-l { color: var(--muted); font-size: 12px; }
.btn { border: 1px solid var(--border); background: var(--panel); border-radius: 6px; padding: 3px 10px; font-size: 12px; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.danger { color: var(--red); }
.btn.danger.armed { background: var(--red); color: #fff; border-color: var(--red); }
.status-l { font-size: 12px; display: flex; align-items: center; gap: 6px; }
.status-l.err { color: var(--red); }
table.api { width: 100%; border-collapse: collapse; font-size: 12px; }
table.api th { text-align: left; color: var(--muted); font-weight: 500; padding: 3px 4px; border-bottom: 1px solid var(--border); }
table.api td { padding: 5px 4px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.api code { font-size: 11.5px; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; user-select: all; }
.bar { width: 110px; height: 6px; background: var(--gray-bg); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
.bar i { display: block; height: 100%; background: var(--green); }
.bar.mid i { background: var(--yellow); } .bar.low i { background: var(--red); }
.hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
.hint code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
.notify-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 12.5px; margin: 4px 0 8px; }
.notify-grid label { display: flex; gap: 6px; align-items: center; }
input[type=time] { font: inherit; font-size: 12px; padding: 1px 4px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--panel); color: var(--text); }
.kbd-help { display: flex !important; flex-direction: row !important; flex-wrap: wrap; gap: 6px 14px; }
kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px;
  padding: 0 4px; background: var(--panel-2); color: var(--text); }
.form-grid { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; align-items: center; font-size: 12.5px; }
.toast { position: fixed; bottom: 14px; right: 16px; background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-left: 3px solid var(--accent); padding: 5px 12px; border-radius: 6px; font-size: 12px; z-index: 50; opacity: 0; transform: translateY(4px);
  transition: opacity .2s, transform .2s; pointer-events: none; box-shadow: 0 2px 8px #0001; }
.toast.show { opacity: 1; transform: none; pointer-events: auto; }
.toast button { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0 0 0 8px; }
.why { grid-column: 1 / -1; color: var(--muted); }
.why b { color: var(--text); font-weight: 600; }
.spin { display: inline-block; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 2px 9px; font-size: 12px;
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.chip.on { outline: 2px solid var(--accent); outline-offset: -1px; }
.chip .n { font-weight: 600; }
.chip.zero { opacity: .45; }
.fsep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
.flabel { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.chip.dd-btn { width: 178px; justify-content: space-between; padding: 3px 10px; }
.chip.dd-btn .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.chip.dd-btn .cnt { flex: none; font-size: 11px; font-weight: 600; background: var(--accent); color: var(--panel);
  border-radius: 999px; padding: 0 6px; }
.chip.dd-btn .caret { flex: none; color: var(--muted); }
.chip.dd-btn.active { border-color: var(--accent); color: var(--accent); }
.chip.dd-btn.teams { width: auto; }
.clear { border: 0; background: none; color: var(--accent); font-size: 12px; padding: 2px 4px; }
.clear.hidden { visibility: hidden; }
#ddpanel { position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 6px 20px #0003; padding: 6px; width: 320px; max-height: 460px; display: none; flex-direction: column; gap: 6px; }
#ddpanel.show { display: flex; }
#ddpanel input[type=search] { width: 100%; }
.dd-list { overflow: auto; display: flex; flex-direction: column; }
.dd-list label { display: flex; gap: 8px; align-items: center; padding: 4px 8px; border-radius: 5px; cursor: pointer; }
/* Room for the 4px avatar rings, so neighbouring rows and the scroll edge don't cut them. */
.dd-list .avw, .detail li > .avw { margin: 3px; }
.dd-list label:hover { background: var(--panel-2); }
.dd-list .n { margin-left: auto; color: var(--muted); font-size: 11px; }
.dd-list .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-list .org { color: var(--muted); }
.dd-actions { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 0 4px; }
.dd-actions button { border: 0; background: none; color: var(--accent); padding: 0; }

/* Full width with comfortable side margins that grow on big screens. */
:root { --gutter: clamp(16px, 3vw, 48px); }
main { padding: 12px var(--gutter) 40px; }
.empty { text-align: center; color: var(--muted); padding: 60px 0; font-size: 14px; }
.banner { display: flex; gap: 10px; align-items: flex-start; background: var(--red-bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; font-size: 12.5px; }
.banner .m { color: var(--muted); margin-top: 2px; }
.onboard { max-width: 620px; margin: 0 auto; text-align: left; color: var(--text); }
.onboard h2 { font-size: 17px; margin: 0 0 10px; }
.onboard ol { padding-left: 20px; line-height: 1.9; }
.onboard .m { color: var(--muted); font-size: 12.5px; }
.sync-grid { grid-template-columns: 90px 1fr; margin-bottom: 6px; }
.sync-grid input { width: 80px; }
.scope-note { text-align: center; color: var(--muted); font-size: 11.5px; opacity: .8; margin-top: 14px; line-height: 1.9; }
.scope-note .clear { font-size: 11.5px; }
/* Inbox blocks: what needs you first, the rest folded below. */
.block-h { display: flex; align-items: baseline; gap: 8px; margin: 4px 2px 8px; font-size: 12px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .05em; color: var(--text); }
.block-h .n { color: var(--muted); font-weight: 500; }
details.block { margin-top: 18px; }
details.block > summary { list-style: none; cursor: pointer; color: var(--muted); user-select: none; }
details.block > summary::-webkit-details-marker { display: none; }
details.block > summary::before { content: "▸"; transition: transform .15s; display: inline-block; }
details.block[open] > summary::before { transform: rotate(90deg); }
.allclear { color: var(--muted); padding: 14px 4px 4px; font-size: 13.5px; }

details.repo { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
details.repo > summary { list-style: none; cursor: pointer; padding: 8px 12px; display: flex; align-items: center; gap: 8px;
  background: var(--panel-2); font-weight: 600; user-select: none; }
details.repo > summary::-webkit-details-marker { display: none; }
details.repo > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
details.repo[open] > summary::before { transform: rotate(90deg); }
summary .org { color: var(--muted); font-weight: 400; }
summary .cnt { color: var(--muted); font-weight: 400; font-size: 12px; }

.pr { border-top: 1px solid var(--border); }
.pr:first-of-type { border-top: 0; }
.line { display: grid; align-items: center; gap: 10px; padding: 7px 12px; cursor: pointer;
  grid-template-columns: 140px minmax(300px, 4fr) minmax(130px, .7fr) minmax(210px, 1.3fr) 80px 62px 140px; }
.line:hover { background: var(--panel-2); }
.cols { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; cursor: default;
  padding: 0 13px 6px; }
.cols:hover { background: none; }
.title { display: flex; align-items: center; gap: 6px; min-width: 0; }
.title .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.title .num { color: var(--muted); }
.unread { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.unread.no { background: transparent; }

.act { font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 8px; white-space: nowrap; justify-self: start; }
.act.review, .act.changes, .act.ci, .act.conflicts { background: var(--red-bg); color: var(--red); }
.act.mention, .act.threads { background: var(--orange-bg); color: var(--orange); }
.act.update { background: var(--yellow-bg); color: var(--yellow); }
/* How long a review has been waiting for you: amber from 1 day, red from 2. */
.act .age { font-weight: 500; opacity: .8; }
.act .age.warn { color: var(--orange); opacity: 1; } .act .age.late { color: var(--red); opacity: 1; font-weight: 700; }
.flag { font-size: 10.5px; font-weight: 600; border-radius: 4px; padding: 0 5px; flex: none; white-space: nowrap; }
.flag.conflict { background: var(--red-bg); color: var(--red); }
.flag.behind { background: var(--yellow-bg); color: var(--yellow); }
.flag.thr { background: var(--orange-bg); color: var(--orange); }
.flag.thr.calm { background: var(--gray-bg); color: var(--muted); }
.size { font-size: 11px; color: var(--muted); flex: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
.size .add { color: var(--green); } .size .del { color: var(--red); }
.pr.sel > .line { box-shadow: inset 3px 0 0 var(--accent); background: var(--panel-2); }
.act.merge { background: var(--green-bg); color: var(--green); }
.act.reapproval { background: var(--yellow-bg); color: var(--yellow); }
.act.waiting, .act.fyi { background: var(--gray-bg); color: var(--muted); }

.state { font-size: 11px; border-radius: 999px; padding: 1px 7px; font-weight: 600; flex: none; }
.state.OPEN { background: var(--green-bg); color: var(--green); }
.state.DRAFT { background: var(--gray-bg); color: var(--muted); }
.state.MERGED { background: var(--purple-bg); color: var(--purple); }
.state.CLOSED { background: var(--red-bg); color: var(--red); }

.who { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--muted); padding-left: 3px; }
.who > span:not(.avw) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.av { width: 20px; height: 20px; border-radius: 50%; background: var(--gray-bg); flex: none; object-fit: cover; }
.avs { display: flex; align-items: center; gap: 3px; flex-wrap: nowrap; overflow: hidden; }
.rv { position: relative; flex: none; }
/* Who is who: you (blue ring), your team (green ring), AI (purple ring + "AI" tag), other bots ("BOT" tag). */
.avw { position: relative; display: inline-flex; flex: none; border-radius: 50%; }
.avw.me .av { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
.avw.crew .av { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--green); }
.avw.ai .av { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--purple); }
.avw.ai::after, .avw.bot::after { position: absolute; top: -5px; right: -7px; font-size: 7.5px; font-weight: 700; line-height: 1.25;
  border-radius: 4px; padding: 0 2px; letter-spacing: .02em; }
.avw.ai::after { content: "AI"; background: var(--purple); color: var(--panel); }
.avw.bot::after { content: "BOT"; background: var(--gray-bg); color: var(--muted); border: 1px solid var(--border); }
.avs { padding: 5px 4px 3px; gap: 8px !important; }
.legend { display: inline-flex; gap: 10px; align-items: center; font-size: 11px; color: var(--muted); margin-left: 4px; }
.legend .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 3px; vertical-align: -1px; }
.detail .stale-txt { color: var(--yellow); }
/* Review state + comment badges under each avatar; a faded badge is out of date (older commit / changed code). */
.rv .badges { position: absolute; right: -6px; bottom: -4px; display: flex; gap: 1px; }
.rv .badges i { display: inline-flex; background: var(--panel); border-radius: 50%; padding: 1px; }
.rv .badges .oi { width: 9px; height: 9px; }
.rv .badges i.faded { opacity: .5; filter: grayscale(1); }
.detail .faded-txt { opacity: .6; }
.team { font-size: 10px; padding: 1px 5px; border-radius: 4px; background: var(--gray-bg); color: var(--muted); flex: none; }
.more { font-size: 11px; color: var(--muted); }
.mention { font-size: 13px; }

.ci { display: flex; align-items: center; gap: 4px; font-size: 12px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dot.SUCCESS { background: var(--green); } .dot.FAILURE, .dot.ERROR { background: var(--red); }
.dot.PENDING, .dot.EXPECTED { background: var(--yellow); } .dot.none { background: var(--gray-bg); }
.ago { color: var(--muted); font-size: 12px; white-space: nowrap; }

.btns { display: flex; gap: 4px; justify-content: flex-end; position: relative; }
.btns button { border: 1px solid var(--border); background: var(--panel); border-radius: 6px; padding: 2px 6px; font-size: 13px; }
.btns button:hover { background: var(--panel-2); }
/* Row actions only when you point at the row (or select it with the keyboard); the space stays reserved. */
.pr .btns button { visibility: hidden; }
.pr:hover .btns button, .pr.sel .btns button, .pr:focus-within .btns button, .pr.menu-on .btns button { visibility: visible; }
/* Floating (fixed) so the repo card's rounded-corner clipping can't hide it; opens upwards when there's no room below. */
.menu { position: fixed; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 6px 20px #0003; padding: 4px; z-index: 10; display: flex; flex-direction: column; min-width: 180px; }
.menu button { border: 0; text-align: left; padding: 5px 8px; border-radius: 5px; background: none; }
.menu button:hover { background: var(--panel-2); }
.menu .sep { border-top: 1px solid var(--border); margin: 4px 0; }
.menu .custom { display: flex; gap: 4px; align-items: center; padding: 0 0 2px; }
.menu .custom button { background: var(--accent); color: #fff; padding: 4px 8px; }
.menu input { margin: 4px; font: inherit; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 3px; }

.detail { padding: 4px 12px 12px 162px; display: flex; flex-wrap: wrap; gap: 14px 28px;
  color: var(--text); font-size: 12.5px; }
.detail h4 { margin: 6px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.detail ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.detail li { display: flex; gap: 10px; align-items: center; }
.detail li:has(.ex, div > .m) { align-items: flex-start; }
.detail .m { color: var(--muted); }
.detail li.check > span { width: 18px; flex: none; text-align: center; }
.detail .ex { color: var(--muted); font-style: italic; }
.markinfo { color: var(--muted); font-size: 12px; }
.detail > div { flex: 1 1 260px; min-width: 0; }
.detail .why, .detail .notified { flex-basis: 100%; }
.detail .notified { color: var(--muted); font-size: 11.5px; }
.detail .people { flex: 3 1 560px; }
.detail .people li > span:nth-child(2) { width: 170px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.theme-pick { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; }
.team-list { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
.team-list label { display: flex; gap: 6px; align-items: center; }
.team-list .n { color: var(--muted); font-size: 11px; margin-left: auto; }
details.adv > summary { cursor: pointer; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }

@media (max-width: 1000px) {
  .row1 { grid-template-columns: 1fr; }
  .row1 .hr { justify-content: flex-start; }
}
@media (max-width: 1100px) {
  .line { grid-template-columns: 140px minmax(180px, 1fr) 180px 80px 62px 140px; }
  .line .c-author { display: none; }
  .detail { padding-left: 12px; }
}
@media (max-width: 720px) {
  .line { grid-template-columns: 1fr auto; }
  .line > *:not(.title):not(.btns) { display: none; }
  .cols { display: none; }
  input[type=search] { width: 140px; }
}
</style>
</head>

    <div class="hr">
    <button class="conn" id="sync" title="GitHub connection status (click to sync)"></button>
    <button class="iconbtn" id="bell" title="Desktop notifications"></button>
    <button class="iconbtn" id="open-settings" title="Settings: notifications, appearance, accounts"></button>
    </div>
  </div>
  <div class="filters" id="filters"></div>
</header>
<main id="main"></main>
<div id="ddpanel"></div>

</aside>

function applyPrefs(p) {
  if (!p || typeof p !== "object") return;

  FACETS.forEach(k => { if (Array.isArray(p.f?.[k])) ui.f[k] = p.f[k]; });
  if (Array.isArray(p.collapsed)) ui.collapsed = new Set(p.collapsed);
  if (Array.isArray(p.teams)) ui.teams = p.teams;
  if (THEMES[p.theme]) ui.theme = p.theme;

}
const THEMES = { auto: { icon: "device-desktop", label: "Automatic (follows Ubuntu)" }, light: { icon: "sun", label: "Light" }, dark: { icon: "moon", label: "Dark" } };
function applyTheme() {

function savePrefs() {

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const AI_RE = /claude|copilot|coderabbit|depthfirst|sourcery|codex|gemini|cursor|devin|qodo|codium|ellipsis|greptile|sweep|openai|chatgpt|korbit|bito|graphite|amazon-q|q-developer|codeant|mergify-ai|what-the-diff/i;

function personKind(login) {
  if (!login) return "";
  if (S && S.mes.includes(login)) return "me";
  const isBot = BOTS.has(login) || /\[bot\]$/.test(login);
  if (AI_RE.test(login) && (isBot || /^(claude|copilot|coderabbitai|depthfirst-app)$/i.test(login))) return "ai";
  if (isBot) return "bot";
  if (TEAM.has(login)) return "crew";
  return "";
}
function personTitle(login) {
  const k = personKind(login);
  return k === "me" ? `${login} (you)` : k === "crew" ? `${login} · team ${TEAM.get(login).join(", ")}`
    : k === "ai" ? `${login} · AI` : k === "bot" ? `${login} · bot` : login;
}
function av(url, login, title) {
  const img = url ? `<img class="av" src="${esc(url)}${url.includes("?") ? "&" : "?"}s=40" alt="">` : `<span class="av"></span>`;
  return `<span class="avw ${personKind(login)}" title="${esc(title || personTitle(login))}">${img}</span>`;

const pickedTeams = () => ui.teams ?? (S.teams || []).filter(t => t.size <= 30).map(t => `${t.org}/${t.slug}`);
function computePeople() {
  BOTS = new Set(S.items.flatMap(i => i.bots || []));

  const picked = pickedTeams();
  (S.teams || []).filter(t => picked.includes(`${t.org}/${t.slug}`)).forEach(t =>
    t.members.forEach(m => !S.mes.includes(m) && !(TEAM.get(m) || []).includes(t.slug) && TEAM.set(m, [...(TEAM.get(m) || []), t.slug])));
}
function ago(ts) {
  if (!ts) return "";
  const s = (Date.now() - new Date(ts)) / 1000;
  if (s < 60) return "now";
  if (s < 3600) return `${Math.floor(s / 60)} min`;
  if (s < 86400) return `${Math.floor(s / 3600)} h`;
  return `${Math.floor(s / 86400)} d`;
}
const fmt = ts => ts ? new Date(ts).toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});

  if (!r.ok) throw new Error(data.error || r.status);

}

  try {
    const text = await (await fetch("/api/state")).text();

}

function match(i, skip) {
  const f = ui.f, q = ui.q.toLowerCase();

    && (skip === "repos" || !f.repos.length || f.repos.includes(i.repo))
    && (skip === "authors" || !f.authors.length || f.authors.includes(i.author.login))
    && (skip === "actions" || !f.actions.length || f.actions.includes(i.action))
    && (skip === "states" || !f.states.length || f.states.includes(i.state))

  fitAvatars();
}

// As many avatars as fit in the Reviews / Comments columns (they grow with the window).
function fitAvatars() {
  const cols = document.querySelector("#main .line.cols");
  if (!cols) return;
  const fit = el => el && el.offsetParent ? Math.max(2, Math.floor((el.clientWidth - 30) / 28)) : 5;
  const r = fit(cols.children[3]);
  if (r !== ui.maxR) { ui.maxR = r; renderMain(); tickAgo(); applySel(); }
}

// Keyboard selection (j/k): a marker on the row, re-applied after every render.
function visibleRows() { return [...document.querySelectorAll("#main .pr[data-key]")].filter(el => el.offsetParent); }
function applySel() {
  document.querySelectorAll(".pr.sel").forEach(el => el.dataset.key !== ui.sel && el.classList.remove("sel"));
  const el = ui.sel && document.querySelector(`.pr[data-key="${CSS.escape(ui.sel)}"]`);
  if (el) el.classList.add("sel");
  return el;
}
function moveSel(step) {
  const rows = visibleRows();
  if (!rows.length) return;
  const at = rows.findIndex(el => el.dataset.key === ui.sel);
  const next = rows[at < 0 ? (step > 0 ? 0 : rows.length - 1) : Math.min(rows.length - 1, Math.max(0, at + step))];
  ui.sel = next.dataset.key;
  applySel();
  next.scrollIntoView({ block: "nearest" });
}
function onShortcut(e) {
  const el = applySel();
  if (e.key === "j" || e.key === "ArrowDown") return moveSel(1);
  if (e.key === "k" || e.key === "ArrowUp") return moveSel(-1);
  if (!el) return false;
  const item = S.items.find(i => i.key === ui.sel);
  if (e.key === "Enter") { ui.expanded.has(ui.sel) ? ui.expanded.delete(ui.sel) : ui.expanded.add(ui.sel); return render(); }
  // Click the title link (the window hands links to the browser; WebKitGTK ignores window.open).
  if (e.key === "o") return el.querySelector("a.t")?.click();
  if (e.key === "c") return copyText(item.url);
  if (item.tab !== "inbox") return false;
  if (e.key === "e" || e.key === "s") {
    const rows = visibleRows(), at = rows.indexOf(el);
    if (e.key === "s") { const b = el.querySelector('[data-do="snooze"]'); return ui.menu === ui.sel ? closeSnooze() : openSnooze(ui.sel, b); }
    ui.sel = (rows[at + 1] || rows[at - 1])?.dataset.key;  // keep the cursor in place once the row disappears
    return markPR(item.key, "done");
  }
  return false;
}

function renderHeader() {
  setHTML(document.getElementById("tabs"), Object.entries(TABS).map(([k, label]) =>

}

function renderConn() {
  const el = document.getElementById("sync");
  let cls, text, tip;
  const accts = S ? activeAccounts() : [];
  if (backendDown || !S) {
    cls = "err"; text = "App disconnected";
    tip = "The local PR Inbox server is not responding. Close and reopen the app.";
  } else if (!accts.length) {
    cls = "warn"; text = "No active accounts"; tip = "Enable or add an account in Settings";
  } else {
    const failed = accts.filter(a => a.error);
    const oldest = accts.map(a => a.last_sync || "").sort()[0];
    const staleMs = Date.now() - new Date(oldest || 0);
    tip = accts.map(a => {
      const rate = ["core", "graphql"].filter(k => a.rate?.[k]).map(k => `${k === "core" ? "REST" : "GraphQL"} ${a.rate[k].remaining}/${a.rate[k].limit}`).join(" · ");
      return `${a.error ? "✗" : "✓"} ${a.label} (${a.login}): ${a.error ? a.error : `synced ${a.last_sync ? fmt(a.last_sync) : "never"}`}${!a.error && a.failures ? ` · retrying after: ${a.last_failure}` : ""}${rate ? " · quota " + rate : ""}`;
    }).concat([`Syncs every ${S.poll}s · click to sync now · details in Settings`]).join("\n");
    const n = accts.length > 1 ? ` (${accts.length} accounts)` : "";
    if (failed.length) {
      cls = "err";
      text = failed.length === accts.length ? (/token|auth|401|expired/i.test(failed[0].error) ? "GitHub: session expired" : "GitHub: error")
        : `GitHub: error in ${failed.map(a => a.label).join(", ")}`;
    }
    else if (S.syncing && !oldest) { cls = "syncing"; text = "Connecting to GitHub…"; }
    else if (staleMs > S.poll * 3000) { cls = "warn"; text = `GitHub: not synced for ${ago(oldest)}`; }
    else { cls = S.syncing ? "syncing" : "ok"; text = S.syncing ? "Syncing…" : `Synced ${ago(oldest) === "now" ? "just now" : ago(oldest) + " ago"}${n}`; }
  }
  el.className = "conn " + cls;
  el.title = tip;
  setHTML(el, `<span class="dot"></span><span class="txt">${esc(text)}</span>`);
}

// Hourly GraphQL spend per account at a given interval, from what the last light and full syncs really cost.
function quotaEstimate(poll) {
  const perHour = 3600 / poll, fulls = Math.min(perHour, 3600 / S.full_refresh), lights = perHour - fulls;
  const parts = activeAccounts().map(a => {
    const full = a.cost?.full ?? a.cost?.light, light = a.cost?.light ?? full;
    if (full == null) return null;
    const est = Math.round(fulls * full + lights * light);
    return `<b>${esc(a.label)}</b> ≈ ${est.toLocaleString("en-GB")} points/hour (${Math.round(est / 50)}% of 5,000)`;
  }).filter(Boolean);
  return parts.length ? `At this interval, GraphQL quota (measured on the last syncs): ${parts.join(" · ")}`
    : "The quota estimate appears after the first syncs.";
}
async function settingsPost(path, body, okMsg) {

function toast(msg, ms = 2500, action, icon) {
  const el = document.getElementById("toast");
  el.innerHTML = (icon ? ic(icon) + " " : "") + esc(msg) + (action ? `<button data-toast-action>${esc(action.label)}</button>` : "");
  el._run = action?.run;
  el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(() => { el.classList.remove("show"); el._run = null; }, ms);
}
function copyText(text) {
  // Synchronous copy inside the click (works in WebKitGTK); async Clipboard API as a fallback.
  let ok = false;
  try {
    const ta = Object.assign(document.createElement("textarea"), { value: text });
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove();
  } catch {}
  if (ok) return toast("Link copied", 2500, null, "link");
  const timeout = new Promise((_, rej) => setTimeout(rej, 1500));
  Promise.race([navigator.clipboard.writeText(text), timeout])
    .then(() => toast("Link copied", 2500, null, "link"), () => toast("Could not copy the link", 2500, null, "alert"));
}

const LATER = new Set(["waiting", "fyi"]);  // nothing for you to do now (also left out of the dock counter)
function repoGroups(items) {
  // Same repo seen from two accounts = two groups, so nobody mixes them up.
  const groups = {};
  items.forEach(i => (groups[multi() ? `${i.account}|${i.repo}` : i.repo] ||= []).push(i));
  return Object.entries(groups).map(([gid, prs]) => {
    prs.sort((a, b) => a.priority - b.priority || b.activity.localeCompare(a.activity));
    return { gid, repo: prs[0].repo, account: prs[0].account, prs, prio: prs[0].priority,
             last: prs.reduce((m, p) => p.activity > m ? p.activity : m, "") };
  }).sort((a, b) => a.prio - b.prio || b.last.localeCompare(a.last)).map(g => {
    const [org, name] = g.repo.split("/");
    const top = g.prs[0].action;
    return `<details class="repo" data-repo="${esc(g.gid)}" style="--acc:${esc(acctOf(g.account).color)}" ${ui.collapsed.has(g.gid) ? "" : "open"}>
      <summary>${multi() ? acctBadge(g.account) : ""}<span><span class="org">${esc(org)}/</span>${esc(name)}</span>
        <span class="cnt">${g.prs.length} PR${g.prs.length > 1 ? "s" : ""}</span>
        ${!LATER.has(top) ? `<span class="act ${top}">${ACTIONS[top].icon} ${ACTIONS[top].label}</span>` : ""}
      </summary>
      ${g.prs.map(prRow).join("")}
    </details>`;
  }).join("");
}

    + foot(true));
}

// Repo / author picker: a floating panel, rendered separately so ticking a box doesn't rebuild (and re-scroll) it.
function openDD(name, btn) {
  ui.dd = name; ui.ddq = "";
  const panel = document.getElementById("ddpanel");
  placeDD();
  const search = ["states", "actions", "accounts"].includes(name) ? "" : `<input type="search" id="ddq" placeholder="${name === "repos" ? "Filter repos…" : "Filter authors…"}">`;
  panel.style.width = name === "states" ? "240px" : name === "actions" ? "260px" : "";
  panel.innerHTML = `${search}
    <div class="dd-actions"><span id="ddsum"></span><span><button data-dd-all>Select visible</button> · <button data-dd-none>Show all</button></span></div>
    <div class="dd-list" id="ddlist"></div>`;

function placeDD() {
  const btn = document.querySelector(`[data-dd="${ui.dd}"]`), panel = document.getElementById("ddpanel");
  if (!btn) return;
  const r = btn.getBoundingClientRect();
  panel.style.left = Math.max(8, Math.min(r.left, innerWidth - 330)) + "px";
  panel.style.top = (r.bottom + 4) + "px";
  panel.style.maxHeight = Math.max(200, Math.min(460, innerHeight - r.bottom - 16)) + "px";
}
function closeDD() { ui.dd = null; document.getElementById("ddpanel").classList.remove("show"); }
function ddOptions() {
  const name = ui.dd;
  const counts = facetCounts(name);
  if (name === "states") return Object.keys(STATES).map(v => ({ v, n: counts[v] || 0, on: ui.f.states.includes(v) }));
  if (name === "actions") return Object.keys(ACTIONS).map(v => ({ v, n: counts[v] || 0, on: ui.f.actions.includes(v) }));
  if (name === "accounts") return activeAccounts().map(a => ({ v: a.id, n: counts[a.id] || 0, on: ui.f.accounts.includes(a.id) }));
  const all = new Set([...S.items.map(i => name === "repos" ? i.repo : i.author.login), ...ui.f[name]]);
  const q = ui.ddq.toLowerCase();
  return [...all].filter(v => !q || v.toLowerCase().includes(q) || (name === "authors" && S.mes.includes(v) && "you".includes(q)))
    .map(v => ({ v, n: counts[v] || 0, on: ui.f[name].includes(v) }))
    .sort((a, b) => (name === "authors" && S.mes.includes(b.v) - S.mes.includes(a.v)) || b.on - a.on || b.n - a.n || a.v.localeCompare(b.v));
}
function renderDDList() {
  const opts = ddOptions(), name = ui.dd;
  setHTML(document.getElementById("ddlist"), opts.map(o => {
    let label;
    if (name === "states") label = `<span class="state ${o.v}">${STATES[o.v]}</span>`;
    else if (name === "accounts") label = `${acctBadge(o.v)}<span class="lbl org">${esc(acctOf(o.v).login)}</span>`;
    else if (name === "actions") label = `<span class="act ${o.v}">${ACTIONS[o.v].icon} ${ACTIONS[o.v].label}</span>`;
    else if (name === "repos") { const [org, r] = o.v.split("/"); label = `<span class="lbl"><span class="org">${esc(org)}/</span>${esc(r)}</span>`; }
    else { const it = S.items.find(i => i.author.login === o.v); label = `${av(it?.author.avatar, o.v)}<span class="lbl">${esc(authorLabel(o.v))}</span>`; }
    return `<label><input type="checkbox" data-ddv="${esc(o.v)}" ${o.on ? "checked" : ""}>${label}<span class="n">${o.n}</span></label>`;
  }).join("") || `<div class="dd-actions">No results</div>`);
  document.getElementById("ddsum").textContent = ui.f[name].length ? `${ui.f[name].length} selected` : "Showing all";
}

function prRow(i) {

  const MAXR = ui.maxR, ppl = people(i);

      : `<span class="rv">${av(p.avatar, p.login, personSummary(p))}<span class="badges">${badges(p)}</span></span>`).join("")

  const ci = i.ci.state;

  const open = ui.expanded.has(i.key);

      <span class="act ${i.action}" title="${esc(i.why || "")}${i.review_since ? ` · Requested: ${esc(fmt(i.review_since))}` : ""}">${a.icon} ${a.label}${reviewAge(i)}</span>
      <div class="title">
        <span class="unread ${i.unread ? "" : "no"}" title="${i.unread ? "Unread notification" : ""}"></span>
        ${i.state !== "OPEN" ? `<span class="state ${i.state}">${STATES[i.state]}</span>` : ""}
        <a class="t" href="${esc(i.url)}" target="_blank" title="${esc(i.title)}"><span class="num">#${i.number}</span> ${esc(i.title)}</a>
        ${i.pending_mentions ? `<span class="mention" title="${i.pending_mentions} unanswered mention(s)">${ic("mention")}</span>` : ""}
        ${i.conflicts ? `<span class="flag conflict" title="Conflicts with the base branch">${ic("alert")} conflicts</span>` : ""}
        ${i.behind ? `<span class="flag behind" title="The branch is behind the base and the repo requires updating it">${ic("git-branch")} behind</span>` : ""}

// Review waiting time on the Review chip; the class changes with the clock so the row re-renders when it crosses a threshold.
function reviewAge(i) {
  if (!i.review_since) return "";
  const h = (Date.now() - new Date(i.review_since)) / 3600e3;
  return ` <span class="age ${h >= 48 ? "late" : h >= 24 ? "warn" : ""}">· ${h < 1 ? "<1 h" : h < 24 ? Math.floor(h) + " h" : Math.floor(h / 24) + " d"}</span>`;
}
function sizeHtml(sz) {
  if (sz?.additions == null) return "";
  const k = n => n >= 1000 ? (n / 1000).toFixed(1).replace(".0", "") + "k" : n;
  const files = sz.files != null ? ` · ${sz.files} file${sz.files === 1 ? "" : "s"}` : "";
  return `<span class="size" title="${sz.additions} lines added, ${sz.deletions} deleted, ${sz.files} file(s)"><span class="add">+${k(sz.additions)}</span> <span class="del">−${k(sz.deletions)}</span>${files}</span>`;
}

// Reviewers and commenters as one list of people: you first, then reviews, pending requests, comment-only.
function people(i) {
  const map = new Map(i.reviewers.map(r => [r.team ? "team:" + r.login : r.login, { ...r, comments: 0 }]));
  i.commenters.forEach(c => {
    const p = map.get(c.login);
    const extra = { comments: c.count, commentsOutdated: c.outdated, lastComment: c.last };
    p ? Object.assign(p, extra, { avatar: p.avatar || c.avatar }) : map.set(c.login, { login: c.login, avatar: c.avatar, state: null, ...extra });
  });
  const rank = p => S.mes.includes(p.login) ? 0 : p.state && p.state !== "PENDING" ? 1 : p.state === "PENDING" ? 2 : 3;
  return [...map.values()].sort((a, b) => rank(a) - rank(b));
}
// Review icon + comment icon; a faded badge means out of date (review on an older commit / comments before the latest commit).
function badges(p) {
  const out = [];
  if (p.state && p.state !== "COMMENTED") out.push(`<i class="${p.stale ? "faded" : ""}">${REVIEW_ICON[p.state] || "?"}</i>`);
  if (p.comments || p.state === "COMMENTED") out.push(`<i class="${p.comments && p.commentsOutdated ? "faded" : ""}">${ic("comment", "mut")}</i>`);
  return out.join("");
}
function commentText(p, short) {
  if (!p.comments) return p.state === "COMMENTED" ? "commented" : "";
  return `${p.comments} comment${p.comments > 1 ? "s" : ""}${p.commentsOutdated
    ? short ? " (outdated)" : " (outdated: before the latest commit or on changed code)" : ""}`;
}
function personSummary(p) {
  const parts = [p.state && p.state !== "COMMENTED" ? reviewText(p) : "", commentText(p)].filter(Boolean);
  return `${personTitle(p.login)}: ${parts.join(" · ")}`;
}

function reviewText(r) {
  const base = REVIEW_TEXT[r.state] || r.state;
  if (r.stale && r.state === "APPROVED") return `${base} on an older commit (re-approval needed)`;
  if (r.stale && r.state === "CHANGES_REQUESTED") return `${base} · before the latest commits (re-review pending)`;
  if (r.rerequested) return `${base} · re-review requested (before: ${REVIEW_TEXT[r.prev] || r.prev})`;
  return base;
}

function buttons(i) {
  if (i.tab !== "inbox") {
    const info = i.tab === "snoozed" ? `until ${fmt(i.mark.until)}` : "";
    return `<span class="markinfo">${info}</span><button data-do="copy" title="Copy PR link">${ic("link")}</button><button data-do="unmark" title="Back to Inbox">${ic("undo")}</button>`;
  }
  return `<button data-do="copy" title="Copy PR link">${ic("link")}</button>
          <button data-do="done" title="Done (comes back on new activity)">${ic("check")}</button>
          <button data-do="snooze" title="Snooze">${ic("clock")}</button>
          <button data-do="mute" title="Mute (also unsubscribes on GitHub)">${ic("bell-slash")}</button>`;
}

function detail(i) {
  const reasons = [...new Set(i.threads.map(t => REASONS[t.reason] || t.reason))];
  const notified = i.threads.length ? `Notified for: ${esc(reasons.join(", "))} · last ${esc(fmt(i.threads[0].updated_at))}`
    : "Found by search (no GitHub notification)";
  const mentions = i.mentions.map(m => `<li>${av(m.avatar, m.by)}<div><a href="${esc(m.url)}" target="_blank"><b>${esc(m.by)}</b></a>
      <span class="m">${fmt(m.at)} ${m.answered ? "· answered" : "· <b>unanswered</b>"}</span><div class="ex">${esc(m.excerpt)}</div></div></li>`).join("");
  const ppl = people(i).map(p => {
    const review = p.state && p.state !== "COMMENTED"
      ? `<span class="${p.stale ? "faded-txt" : ""}">${REVIEW_ICON[p.state] || ""} ${esc(reviewText(p))}</span>` : "";
    const comm = commentText(p)
      ? `<span class="${p.commentsOutdated ? "faded-txt" : ""}">${ic("comment", "mut")} ${esc(commentText(p, true))}${p.lastComment ? ` · ${esc(fmt(p.lastComment))}` : ""}</span>` : "";
    return `<li title="${esc(personSummary(p))}">${p.team ? `<span class="team">@${esc(p.login)}</span>` : av(p.avatar, p.login, personSummary(p))}
      <span>${S.mes.includes(p.login) ? "<b>you</b>" : esc(p.login)}</span><span class="m">${[review, comm].filter(Boolean).join(" · ")}</span></li>`;
  }).join("");
  const merge = (i.conflicts ? `<li class="check"><span>${ic("alert", "bad")}</span><div><a href="${esc(i.url)}#partial-pull-merging" target="_blank">Conflicts with the base branch</a><div class="m">they must be resolved before merging</div></div></li>` : "")
    + (i.behind ? `<li class="check"><span>${ic("git-branch", "wait")}</span><div><a href="${esc(i.url)}#partial-pull-merging" target="_blank">Branch behind the base</a><div class="m">the repo requires updating it to merge</div></div></li>` : "");
  const convs = i.open_threads.map(t => `<li>${av(t.avatar, t.by)}<div><a href="${esc(t.url)}" target="_blank"><b>${esc(authorLabel(t.by))}</b></a>
      <span class="m">${t.path ? `· ${esc(t.path.split("/").pop())}` : ""}${t.outdated ? " · outdated" : ""}</span>
      <div class="ex">${esc(t.excerpt)}</div>
      <div class="m">${t.replies ? `${t.replies} repl${t.replies > 1 ? "ies" : "y"} · last from ${esc(authorLabel(t.last_by))}` : "no replies"} · <span data-ago="${esc(t.last_at)}" title="${esc(fmt(t.last_at))}"></span>${t.waiting ? " · <b>waiting for your reply</b>" : ""}</div></div></li>`).join("");
  const sz = i.size?.additions != null ? `<div class="m">Size: ${sizeHtml(i.size)}</div>` : "";
  const checks = merge + i.ci.failing.map(c => checkItem(c, ic("x-circle-fill", "bad"), FAIL_TEXT[c.result] || "failed", c.finished)).join("")
    + i.ci.running.map(c => checkItem(c, ["IN_PROGRESS", "PENDING"].includes(c.result) ? ic("dot-fill", "wait") : ic("clock", "mut"), RUN_TEXT[c.result] || "running", c.started)).join("")
    + (i.ci.total ? `<li class="m">${i.ci.passed ? `${ic("check-circle-fill", "ok")} ${i.ci.passed} passed · ` : ""}${i.ci.total} checks in total</li>`
                  : `<li class="m">No checks</li>`);
  // Most useful first; empty sections are left out.
  return `<div class="detail">
    <div class="why">${multi() ? acctBadge(i.account) + " " : ""}<b>${ACTIONS[i.action].icon} ${ACTIONS[i.action].label}:</b> ${esc(i.why || "")}${i.review_since ? ` · <b>Requested:</b> ${esc(fmt(i.review_since))}` : ""}${i.role?.length ? ` · <b>Your role:</b> ${esc(i.role.join(", "))}` : ""}</div>
    ${convs ? `<div><h4>Unresolved conversations (${i.open_threads.length})</h4><ul>${convs}</ul></div>` : ""}
    <div><h4>Pipeline</h4><ul>${checks}</ul>${sz}</div>
    ${ppl ? `<div class="people"><h4>Reviews &amp; comments</h4><ul>${ppl}</ul></div>` : ""}
    ${mentions ? `<div><h4>Direct mentions</h4><ul>${mentions}</ul></div>` : ""}
    <div class="notified">${notified}</div>
  </div>`;
}

const FAIL_TEXT = { FAILURE: "failed", TIMED_OUT: "timed out", STARTUP_FAILURE: "failed to start", ACTION_REQUIRED: "action required", ERROR: "error" };
const RUN_TEXT = { IN_PROGRESS: "running", QUEUED: "queued", REQUESTED: "queued", WAITING: "waiting for approval",
                   PENDING: "running", EXPECTED: "waiting to start" };
// One failing/running check in the detail: linked name, its workflow and how long ago it failed or started.
function checkItem(c, icon, text, ts) {
  const name = c.url ? `<a href="${esc(c.url)}" target="_blank">${esc(c.name)}</a>` : esc(c.name);
  const when = ts ? ` · <span data-ago="${esc(ts)}" title="${esc(fmt(ts))}"></span>` : "";
  return `<li class="check"><span>${icon}</span><div>${name}${c.workflow ? ` <span class="m">· ${esc(c.workflow)}</span>` : ""}
    <div class="m">${text}${when}</div></div></li>`;
}

function openSnooze(key, btn) {
  const menu = document.getElementById("snoozemenu");
  const pad = n => String(n).padStart(2, "0");
  const d = new Date(Date.now() + 3600e3);
  const local = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  menu.innerHTML = `<button data-snooze="1h">In 1 hour</button>
    <button data-snooze="3h">In 3 hours</button>
    <button data-snooze="tomorrow">Tomorrow at 9:00</button>
    <button data-snooze="monday">Monday at 9:00</button>
    <div class="sep"></div>
    <div class="custom"><input type="datetime-local" id="snooze-at" value="${local}" min="${local.slice(0, 16)}"><button data-snooze-custom>OK</button></div>`;
  ui.menu = key;
  btn.closest(".pr")?.classList.add("menu-on");
  menu.classList.remove("hidden");
  const r = btn.getBoundingClientRect(), h = menu.offsetHeight, w = menu.offsetWidth;
  menu.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
  menu.style.top = (r.bottom + 4 + h > innerHeight - 8 ? Math.max(8, r.top - 4 - h) : r.bottom + 4) + "px";
}
function closeSnooze() {
  ui.menu = null;
  document.querySelectorAll(".pr.menu-on").forEach(el => el.classList.remove("menu-on"));
  document.getElementById("snoozemenu").classList.add("hidden");
}

function snoozeUntil(kind) {
  const d = new Date();
  if (kind === "1h") d.setHours(d.getHours() + 1);
  else if (kind === "3h") d.setHours(d.getHours() + 3);
  else {
    d.setDate(d.getDate() + (kind === "tomorrow" ? 1 : ((8 - d.getDay()) % 7 || 7)));
    d.setHours(9, 0, 0, 0);
  }
  return d;
}
const isoZ = d => d.toISOString().replace(/\.\d{3}Z$/, "Z");

// --- events ------------------------------------------------------------

document.addEventListener("click", async e => {
  const t = e.target;
  if (t.closest("[data-open-settings]")) return openSettings();
  if (t.closest("[data-toast-action]")) {
    const el = document.getElementById("toast"), run = el._run;
    el.classList.remove("show"); el._run = null;
    return run?.();
  }
  if (t.closest("#open-settings")) return openSettings();
  if (t.closest("[data-close-settings]") || t.id === "backdrop") return closeSettings();
  if (t.closest("#settings")) {
    const card = t.closest("[data-acct]");
    if (t.closest("[data-acct-remove]")) {
      if (settings.armed !== card.dataset.acct) { settings.armed = card.dataset.acct; return renderSettings(); }
      settings.armed = null;
      return settingsPost("/api/accounts/remove", { id: card.dataset.acct }, "Account removed");
    }
    if (settings.armed) { settings.armed = null; renderSettings(); }
    const gh = t.closest("[data-add-gh]");
    if (gh) {
      const [host, login] = gh.dataset.addGh.split("|");
      settings.gh = settings.gh.filter(g => !(g.host === host && g.login === login));
      return settingsPost("/api/accounts/add", { source: "gh", host, login }, `Account ${login} added`);
    }
    if (t.closest("[data-add-token]")) {
      const v = id => document.getElementById(id).value.trim();
      settings.busy = true; renderSettings();
      const body = { source: "token", host: v("tok-host"), label: v("tok-label"), token: v("tok-token") };
      settings.busy = false;
      await settingsPost("/api/accounts/add", body, "Account added");
      if (!settings.msg) ["tok-token", "tok-label"].forEach(id => document.getElementById(id).value = "");
      return;
    }
    return;
  }
  if (t.closest("a[target=_blank]")) { openedAt = Date.now(); toast("↗ Opened in the browser"); return; }
  if (t.closest("#ddpanel")) {
    if (t.closest("[data-dd-none]")) { ui.f[ui.dd] = []; savePrefs(); render(); }
    if (t.closest("[data-dd-all]")) { ui.f[ui.dd] = ddOptions().filter(o => o.n).map(o => o.v); savePrefs(); render(); }
    return;
  }
  const dd = t.closest("[data-dd]");
  if (dd) { ui.dd === dd.dataset.dd ? closeDD() : openDD(dd.dataset.dd, dd); return; }
  if (ui.dd) closeDD();
  const tab = t.closest("[data-tab]");
  if (tab) { ui.tab = tab.dataset.tab; savePrefs(); return render(); }
  if (t.closest("[data-clear]")) {
    FACETS.forEach(k => ui.f[k] = []); savePrefs();
    ui.q = ""; document.getElementById("q").value = "";
    return render();
  }
  const pr = t.closest(".pr");
  if (t.closest("#snoozemenu")) {
    const key = ui.menu, sn = t.closest("[data-snooze]");
    if (sn) { closeSnooze(); return markPR(key, "snooze", isoZ(snoozeUntil(sn.dataset.snooze))); }
    if (t.closest("[data-snooze-custom]")) {
      const v = document.getElementById("snooze-at").value;
      if (!v || new Date(v) <= new Date()) return toast("Pick a future date");
      closeSnooze(); return markPR(key, "snooze", isoZ(new Date(v)));
    }
    return;
  }
  const btn = t.closest("[data-do]");
  if (btn && pr) {
    const key = pr.dataset.key, what = btn.dataset.do;
    if (what === "copy") return copyText(S.items.find(i => i.key === key).url);
    if (what === "snooze") { ui.menu === key ? closeSnooze() : openSnooze(key, btn); return; }
    closeSnooze();
    return what === "unmark" ? post("/api/unmark", { key }) : markPR(key, what);
  }
  if (ui.menu) closeSnooze();
  const line = t.closest(".line");
  if (line && pr && !line.classList.contains("cols")) {
    const key = pr.dataset.key;
    // A click selects the row while its detail is open; closing it lets go (the buttons hide again).
    if (ui.expanded.has(key)) { ui.expanded.delete(key); if (ui.sel === key) ui.sel = null; }
    else { ui.expanded.add(key); ui.sel = key; }
    render();
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  const card = t.closest?.("[data-acct]");
  if (card && t.matches("[data-acct-enabled]")) return settingsPost("/api/accounts/update", { id: card.dataset.acct, enabled: t.checked });
  if (card && t.matches("[data-acct-color]")) return settingsPost("/api/accounts/update", { id: card.dataset.acct, color: t.value });
  if (card && t.matches("[data-acct-label]") && t.value.trim()) { t.blur(); return settingsPost("/api/accounts/update", { id: card.dataset.acct, label: t.value.trim() }); }
  if (t.matches("[data-notify]")) return settingsPost("/api/settings", { notify: t.checked });
  if (t.matches("[data-sync]")) {
    const k = t.dataset.sync, [lo, hi] = S.limits[k], v = Math.round(+t.value);
    if (!(v >= lo && v <= hi)) { t.value = S[k]; return toast(`Choose between ${lo} and ${hi}`, 3000, null, "alert"); }
    return settingsPost("/api/settings", { [k]: v }, k === "days" ? `Showing ${v} days: reading them now` : `Syncing every ${v} s`);
  }
  if (t.matches("[data-theme-pick]")) { ui.theme = t.dataset.themePick; applyTheme(); return savePrefs(); }
  if (t.matches("[data-team]")) { toggleFilter("teams", t.dataset.team); renderMain(); tickAgo(); return renderSettings(); }
  if (t.matches("[data-notify-action]")) {
    const sel = [...document.querySelectorAll("[data-notify-action]:checked")].map(x => x.dataset.notifyAction);
    return settingsPost("/api/settings", { notify_actions: sel });
  }
  if (t.matches("[data-quiet]")) {
    const k = t.dataset.quiet;
    if (t.type === "time" && !t.value) return;
    return settingsPost("/api/settings", { quiet: { [k]: t.type === "checkbox" ? t.checked : t.value } });
  }
  if (t.matches("[data-ddv]")) {
    toggleFilter(ui.dd, t.dataset.ddv);
    renderHeader(); renderFilters(); renderMain(); tickAgo(); placeDD();
    document.getElementById("ddsum").textContent = ui.f[ui.dd].length ? `${ui.f[ui.dd].length} selected` : "Showing all";
    return;
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "ddq") { ui.ddq = e.target.value; renderDDList(); }
  if (e.target.id === "q") { ui.q = e.target.value; render(); }
  if (e.target.dataset?.sync === "poll" && +e.target.value >= S.limits.poll[0])  // live estimate while typing
    document.getElementById("quota-est").innerHTML = quotaEstimate(+e.target.value);
});
document.addEventListener("toggle", e => {
  if (e.target.dataset?.block !== undefined) { ui.laterOpen = e.target.open; return savePrefs(); }
  if (e.target.dataset?.adv !== undefined) { ui.advOpen = e.target.open; return; }
  const repo = e.target.dataset?.repo;
  if (!repo) return;
  e.target.open ? ui.collapsed.delete(repo) : ui.collapsed.add(repo);
  savePrefs();
}, true);
document.getElementById("sync").addEventListener("click", async () => {
  await post("/api/sync", {});
  setTimeout(load, 1500);
});
document.getElementById("bell").addEventListener("click", () => post("/api/settings", { notify: !S.notify }));
document.addEventListener("keydown", e => {
  const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)
    || (e.key === "Enter" && ["BUTTON", "A", "SUMMARY"].includes(document.activeElement.tagName));
  if (e.key === "/" && !typing) { e.preventDefault(); document.getElementById("q").focus(); }
  if (!typing && !settings.open && !ui.dd && !e.ctrlKey && !e.metaKey && !e.altKey && S
      && ["j", "k", "ArrowDown", "ArrowUp", "Enter", "o", "c", "e", "s"].includes(e.key)) {
    if (ui.menu && e.key !== "s") closeSnooze();
    if (onShortcut(e) !== false) e.preventDefault();
  }
  if (e.key === "Escape") { if (settings.open) return closeSettings(); closeDD(); closeSnooze(); render(); }
});
window.addEventListener("resize", () => { ui.dd && placeDD(); closeSnooze(); fitAvatars(); });
document.addEventListener("scroll", e => { if (ui.menu && !e.target.closest?.("#snoozemenu")) closeSnooze(); }, true);

applyTheme();
(async () => {
  try { applyPrefs(await api("/api/prefs")); } catch { applyPrefs(ls.get("prefs", null)); }
  await load();
})();
setInterval(() => { if (!ui.menu && !ui.dd) load(); }, 15000);
setInterval(() => { tickAgo(); if (S) renderHeader(); }, 30000);
setInterval(() => { if (ui.menu || ui.dd) load(); }, 60000);  // keep the connection status honest while a menu is open
</script>
</body>
</html>
