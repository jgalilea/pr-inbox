name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh && bash -n pr-inbox
